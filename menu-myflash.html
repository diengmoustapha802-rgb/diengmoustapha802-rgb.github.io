<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Flash – Menu</title>
<style>
/* ===================== MENU MY FLASH ===================== */
:root{
  --mf-bleu:#0b1f4b;      /* bleu marine du logo */
  --mf-bleu-clair:#1e4fd8;
  --mf-gris:#f4f5f7;
  --mf-texte:#111827;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--mf-texte);background:#fff}

/* --- En-tête --- */
.mf-header{
  position:sticky;top:0;z-index:900;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:14px 18px;background:#fff;border-bottom:1px solid #eee;
}
.mf-burger{
  display:flex;align-items:center;gap:10px;justify-self:start;
  background:none;border:0;padding:6px 0;cursor:pointer;
  font-size:15px;font-weight:700;letter-spacing:.5px;color:var(--mf-texte);
}
.mf-burger span.barres{display:flex;flex-direction:column;gap:5px}
.mf-burger span.barres i{display:block;width:26px;height:3px;background:var(--mf-texte);border-radius:2px}
.mf-logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--mf-bleu);font-weight:800;font-size:18px}
.mf-logo img{height:38px}
.mf-panier{
  justify-self:end;position:relative;display:flex;align-items:center;justify-content:center;
  width:44px;height:44px;border:2px solid var(--mf-bleu);border-radius:6px;
  color:var(--mf-bleu);font-weight:700;text-decoration:none;
}
.mf-panier::before{ /* anse du sac */
  content:"";position:absolute;top:-8px;width:16px;height:10px;
  border:2px solid var(--mf-bleu);border-bottom:0;border-radius:10px 10px 0 0;background:#fff;
}

/* --- Fond sombre --- */
.mf-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.35);
  opacity:0;visibility:hidden;transition:.3s;z-index:998;
}

/* --- Tiroir --- */
.mf-tiroir{
  position:fixed;top:0;left:0;bottom:0;width:min(75vw,340px);
  background:#fff;z-index:999;padding:22px 18px;overflow-y:auto;
  transform:translateX(-100%);transition:transform .3s ease;
  box-shadow:4px 0 20px rgba(0,0,0,.08);
}
.mf-fermer{
  position:fixed;top:18px;left:calc(min(75vw,340px) + 16px);z-index:1000;
  background:none;border:0;color:#fff;font-size:42px;line-height:1;cursor:pointer;
  opacity:0;visibility:hidden;transition:.3s;
}
body.mf-ouvert .mf-tiroir{transform:translateX(0)}
body.mf-ouvert .mf-overlay,
body.mf-ouvert .mf-fermer{opacity:1;visibility:visible}
body.mf-ouvert{overflow:hidden}

.mf-recherche{
  display:flex;align-items:center;gap:10px;background:var(--mf-gris);
  border-radius:8px;padding:12px 14px;margin-bottom:22px;
}
.mf-recherche input{border:0;background:none;outline:none;font-size:16px;width:100%}
.mf-recherche svg{flex:none;opacity:.5}

.mf-liens{list-style:none;margin:0;padding:0}
.mf-liens > li > a,
.mf-liens > li > button{
  display:flex;justify-content:space-between;align-items:center;width:100%;
  padding:13px 0;font-size:18px;font-weight:700;color:var(--mf-texte);
  text-decoration:none;background:none;border:0;cursor:pointer;text-align:left;font-family:inherit;
}
.mf-liens a:hover,.mf-liens button:hover{color:var(--mf-bleu-clair)}
.mf-fleche{transition:transform .25s}
.mf-sous{list-style:none;padding:0 0 6px 14px;margin:0;max-height:0;overflow:hidden;transition:max-height .3s}
.mf-sous a{display:block;padding:9px 0;color:#4b5563;text-decoration:none;font-size:16px}
.mf-sous a:hover{color:var(--mf-bleu-clair)}
li.ouvert .mf-sous{max-height:400px}
li.ouvert .mf-fleche{transform:rotate(180deg)}

.mf-whatsapp{
  display:flex;align-items:center;justify-content:center;gap:8px;margin-top:26px;
  background:#25d366;color:#fff;font-weight:700;text-decoration:none;
  padding:13px;border-radius:8px;
}
/* ========================================================= */
</style>
</head>
<body>

<!-- ===================== HTML DU MENU ===================== -->
<header class="mf-header">
  <button class="mf-burger" id="mfOuvrir" aria-label="Ouvrir le menu" aria-expanded="false">
    <span class="barres"><i></i><i></i><i></i></span> MENU
  </button>

  <a href="index.html" class="mf-logo">
    <img src="logo.png" alt="My Flash" onerror="this.remove()"> My Flash
  </a>

  <a href="panier.html" class="mf-panier" aria-label="Panier"><span id="mfNbPanier">0</span></a>
</header>

<div class="mf-overlay" id="mfOverlay"></div>
<button class="mf-fermer" id="mfFermer" aria-label="Fermer le menu">&times;</button>

<nav class="mf-tiroir" id="mfTiroir" aria-label="Menu principal">
  <form class="mf-recherche" id="mfRecherche" role="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" name="q" placeholder="Recherche de produits…">
  </form>

  <ul class="mf-liens">
    <li><a href="index.html">Accueil</a></li>
    <li><a href="index.html#boutique">Boutique</a></li>
    <li>
      <button type="button" class="mf-deroulant">Nos produits
        <svg class="mf-fleche" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <ul class="mf-sous">
        <li><a href="index.html?cat=ordinateurs">Ordinateurs</a></li>
        <li><a href="index.html?cat=iphone">iPhone</a></li>
        <li><a href="index.html?cat=android">Téléphones Android</a></li>
        <li><a href="index.html?cat=apple-watch">Apple Watch</a></li>
        <li><a href="index.html?cat=accessoires">Accessoires</a></li>
      </ul>
    </li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>

  <a class="mf-whatsapp" href="https://wa.me/221788740712" target="_blank" rel="noopener">
    Commander sur WhatsApp
  </a>
</nav>
<!-- ======================================================== -->

<main style="padding:30px 18px">
  <h1>Page de démo</h1>
  <p>Appuyez sur MENU en haut à gauche.</p>
</main>

<!-- ===================== JS DU MENU ===================== -->
<script>
(function(){
  const body = document.body;
  const btn  = document.getElementById('mfOuvrir');

  function ouvrir(){ body.classList.add('mf-ouvert'); btn.setAttribute('aria-expanded','true'); }
  function fermer(){ body.classList.remove('mf-ouvert'); btn.setAttribute('aria-expanded','false'); }

  btn.addEventListener('click', ouvrir);
  document.getElementById('mfFermer').addEventListener('click', fermer);
  document.getElementById('mfOverlay').addEventListener('click', fermer);
  document.addEventListener('keydown', e => { if(e.key === 'Escape') fermer(); });

  // Sous-menu déroulant
  document.querySelectorAll('.mf-deroulant').forEach(b => {
    b.addEventListener('click', () => b.parentElement.classList.toggle('ouvert'));
  });

  // Ferme le menu quand on clique un lien
  document.querySelectorAll('#mfTiroir a').forEach(a => a.addEventListener('click', fermer));

  // Recherche : envoie vers l'accueil avec ?q=...
  document.getElementById('mfRecherche').addEventListener('submit', e => {
    e.preventDefault();
    const q = e.target.q.value.trim();
    if(q) location.href = 'index.html?q=' + encodeURIComponent(q);
  });
})();
</script>
<!-- ====================================================== -->
</body>
</html>

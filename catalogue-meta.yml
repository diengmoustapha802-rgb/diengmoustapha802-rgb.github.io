name: Catalogue Meta

on:
  schedule:
    - cron: "17 4 * * *"   # tous les jours vers 4 h 17 (heure de Dakar)
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node catalogue-meta.mjs
      - name: Enregistrer le catalogue
        run: |
          git config user.name "My Flash catalogue"
          git config user.email "actions@users.noreply.github.com"
          git add catalogue-meta.csv
          git diff --cached --quiet || (git commit -m "Mise à jour du catalogue Meta" && git push)
